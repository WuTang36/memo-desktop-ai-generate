<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2c6fce"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-4%" width="116%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1a1a2e" flood-opacity="0.18"/>
    </filter>
    <filter id="pencilShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1a1a2e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Memo card -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="90" width="272" height="320" rx="22" ry="22" fill="url(#paperGrad)"/>
    <!-- Top accent bar -->
    <rect x="120" y="90" width="272" height="14" rx="7" ry="7" fill="#4a90d9"/>
    <!-- Decorative hash for Markdown -->
    <text x="148" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#4a90d9" opacity="0.8">#</text>
    <!-- Content lines -->
    <line x1="148" y1="180" x2="364" y2="180" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="148" y1="214" x2="350" y2="214" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="148" y1="248" x2="364" y2="248" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="148" y1="282" x2="310" y2="282" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="148" y1="316" x2="364" y2="316" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="148" y1="350" x2="280" y2="350" stroke="#e2e5ee" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Checkmark circle -->
    <circle cx="386" cy="350" r="19" fill="#27ae60"/>
    <polyline points="377,350 383,357 396,341" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pencil -->
  <g filter="url(#pencilShadow)" transform="rotate(48, 415, 185)">
    <rect x="362" y="130" width="18" height="90" rx="3.5" fill="#f6c358"/>
    <polygon points="362,130 371,130 380,96 353,96" fill="#fae3b8"/>
    <rect x="362" y="130" width="18" height="9" rx="2.5" fill="#e8a838"/>
    <polygon points="362,220 380,220 371,265 366,265" fill="#e8a838"/>
    <rect x="364" y="263" width="14" height="7" rx="1.5" fill="#2c2c2c"/>
  </g>
</svg>
